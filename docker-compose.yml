services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: frimz
      POSTGRES_PASSWORD: frimz
      POSTGRES_DB: frimz
    ports:
      - "5436:5432"
    volumes:
      - frimz_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frimz -d frimz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  frimz_pg:
